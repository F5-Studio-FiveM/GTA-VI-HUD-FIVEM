    <div id="hud" class="map-hidden">
        <div id="status" class="status" hidden></div>

        <div id="chips" class="chips" hidden>
            <div class="chip" id="chip-voice">
                <svg class="ring" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>
                <svg class="ic"><use id="voice-icon" href="#i-mic"/></svg>
            </div>
            <div class="chip" id="chip-armed" hidden><svg class="ic"><use href="#i-armed"/></svg></div>
            <div class="chip" id="chip-parachute" hidden><svg class="ic"><use href="#i-parachute"/></svg></div>
            <div class="chip" id="chip-dev" hidden><svg class="ic"><use href="#i-dev"/></svg></div>
        </div>

        <div id="vehicle" class="vehicle" hidden>
            <div class="readout">
                <span class="num" id="speed">0</span>
                <span class="unit" id="speed-unit"></span>
            </div>
            <div class="vchips" id="vehicle-chips"></div>
            <div class="readout small" id="altitude-row" hidden>
                <span class="num" id="altitude">0</span>
                <span class="unit">ALT</span>
            </div>
            <div id="vehicle-rows"></div>
            <div class="telltales">
                <div class="chip" id="chip-cruise" hidden><svg class="ic"><use href="#i-cruise"/></svg></div>
            </div>
        </div>

        <div id="vehicle-info" class="vehicle-info" hidden>
            <div class="vtile" id="vtile">
                <div class="vname-wrap"><div class="vname"><span id="vehicle-make"></span><span id="vehicle-model"></span></div></div>
                <div class="vicons">
                    <div class="chip" id="chip-engine">
                        <svg class="ring" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>
                        <svg class="ic"><use href="#i-engine"/></svg>
                    </div>
                    <div class="chip" id="chip-fuel">
                        <svg class="ring" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>
                        <svg class="ic"><use href="#i-fuel"/></svg>
                    </div>
                    <div class="chip" id="chip-belt" hidden><svg class="ic"><use href="#i-belt"/></svg></div>
                </div>
            </div>
            <div class="nav" id="nav" hidden>
                <div class="nav-text">
                    <div class="nav-t1" id="nav-t1"></div>
                    <div class="nav-t2" id="nav-t2"></div>
                </div>
                <div class="nav-ico"><svg><use id="nav-icon" href="#n-straight"/></svg></div>
            </div>
            <div class="zone" id="zone" hidden></div>
        </div>

        <div id="compass" hidden>
            <div class="strip" id="strip">
                <div class="ruler" id="ruler"></div>
                <div class="pointer" id="pointer"></div>
            </div>
            <div class="streets" id="streets">
                <span id="street1"></span>
                <span class="deg" id="degrees"></span>
                <span id="street2"></span>
            </div>
        </div>

        <div class="corner">
            <div id="weapon" class="weapon" hidden>
                <div class="ammo" id="ammo" hidden><span class="clip" id="ammo-clip"></span><span class="reserve" id="ammo-reserve" hidden></span></div>
                <img class="wicon" id="weapon-icon" alt="" hidden>
            </div>
            <div id="money" class="money">
                <div id="money-lines" hidden>
                    <div class="amt" id="money-bank" hidden><span id="bank">$0</span><span class="disc bank"><svg class="ic"><use href="#i-bank"/></svg></span></div>
                    <div class="amt" id="money-cash" hidden><span id="cash">$0</span><span class="disc cash"><svg class="ic"><use href="#i-wallet"/></svg></span></div>
                </div>
                <div class="delta" id="money-delta" hidden></div>
            </div>
        </div>
    </div>

    <div id="menu" hidden>
        <div class="menu-panel">
            <h1><span id="menu-title"></span><button class="x" id="menu-close" type="button">&#x2715;</button></h1>
            <div class="actions">
                <button class="btn" id="btn-restart" type="button"></button>
                <button class="btn ghost" id="btn-reset" type="button"></button>
            </div>
            <div id="menu-sections"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
